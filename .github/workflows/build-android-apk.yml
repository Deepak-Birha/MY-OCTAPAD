name: Build MY OCTAPAD APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare app files
        run: mkdir -p android/app/src/main/assets/web && cp index.html android/app/src/main/assets/web/index.html
      - name: Build APK
        run: gradle --no-daemon -p android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MY-OCTAPAD-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
